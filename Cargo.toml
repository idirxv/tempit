[package]
name = "tempit"
version = "2.0.0"
edition = "2024"
rust-version = "1.89"
description = "Create, track, jump into and save temporary working directories"
authors = ["Idir Oura <idir.oura@protonmail.com>"]
license = "MIT"
repository = "https://github.com/idirxv/tempit"
readme = "README.md"
keywords = ["cli", "shell", "temporary", "directory", "tmp"]
categories = ["command-line-utilities", "filesystem"]
include = ["/src", "/shell", "/README.md", "/LICENSE"]

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
rustix = { version = "1.1.5", features = ["fs", "process"] }
strsim = "0.11"
thiserror = "2.0.20"
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
