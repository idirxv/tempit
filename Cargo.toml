[package]
name = "tempit"
version = "2.1.0"
edition = "2024"
description = "Manage and jump into temporary working directories"
license = "MIT"
readme = "README.md"
repository = "https://github.com/idirxv/tempit"
homepage = "https://github.com/idirxv/tempit"
keywords = ["cli", "temp", "temporary", "directory", "shell"]
categories = ["command-line-utilities"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[[bin]]
name = "tempit"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
getrandom = "0.3"
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
trycmd = "1"

[profile.release]
lto = true
strip = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unsafe_code = "forbid"
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
